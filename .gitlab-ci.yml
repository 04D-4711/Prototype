stages:
  - comp3900-video
  - comp3900-checks

variables:
  ASSIGNMENT_DOCUMENT_NAME: 'project-documentation'
  ASSIGNMENT_MIN_WORDS: 400
  ASSIGNMENT_MAX_WORDS: 1980
  ASSIGNMENT_MIN_PARTICIPANTS: 3
  ASSIGNMENT_MAX_PARTICIPANTS: 5
  ASSIGNMENT_VIDEO_NAME: 'project-presentation'
  ASSIGNMENT_VIDEO_MIN_DURATION: 30  # in seconds
  ASSIGNMENT_VIDEO_MAX_DURATION: 330  # in seconds (5 minutes + 10% buffer)

check_video_exists:
  stage: comp3900-video
  tags:
    - comp4350
  image: alpine:3.21.2
  script:
    # Check if the file exists
    - |
      if [ -f "$ASSIGNMENT_VIDEO_NAME.mp4" ]; then
        FILE_NAME="$ASSIGNMENT_VIDEO_NAME.mp4"
        echo "Found MP4 file: $FILE_NAME"
      else
        echo "Error: $ASSIGNMENT_VIDEO_NAME.mp4 not found"
        exit 1
      fi
  allow_failure: false

check_video_length:
  stage: comp3900-video
  tags:
    - comp4350
  image:
    name: jrottenberg/ffmpeg:7.1-alpine
    entrypoint: [""]
  variables:
    MIN_LENGTH: $ASSIGNMENT_VIDEO_MIN_DURATION
    MAX_LENGTH: $ASSIGNMENT_VIDEO_MAX_DURATION
    FILE_NAME: $ASSIGNMENT_VIDEO_NAME.mp4
  script:
    # Get the file length in seconds
    - |
      # Extract duration in seconds using ffprobe
      DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 $FILE_NAME)
      # Round to nearest integer if needed
      DURATION_INT=$(printf "%.0f" $DURATION)
      echo "Video duration: $DURATION_INT seconds"

    # Check if duration is within the acceptable range
    - |
      if [ $DURATION_INT -lt $MIN_LENGTH ]; then
        echo "Error: Video is too short. Minimum length is $MIN_LENGTH seconds, but video is $DURATION_INT seconds."
        exit 1
      fi

      if [ $DURATION_INT -gt $MAX_LENGTH ]; then
        echo "Error: Video is too long. Maximum length is $MAX_LENGTH seconds, but video is $DURATION_INT seconds."
        exit 1
      fi

      echo "Video length check passed: $DURATION_INT seconds (required: between $MIN_LENGTH and $MAX_LENGTH seconds)"
  rules:
    - exists:
        - $ASSIGNMENT_VIDEO_NAME.mp4
  allow_failure: true

check_video_resolution:
  stage: comp3900-video
  tags:
    - comp4350
  image:
    name: jrottenberg/ffmpeg:7.1-alpine
    entrypoint: [""]
  variables:
    FILE_NAME: $ASSIGNMENT_VIDEO_NAME.mp4
    MAX_WIDTH: 1920
    MAX_HEIGHT: 1080
  script:
    # Get the video resolution
    - |
      WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=noprint_wrappers=1:nokey=1 $FILE_NAME)
      HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=noprint_wrappers=1:nokey=1 $FILE_NAME)

    # Check if resolution is within the acceptable dimensions
    - |
      if [ $WIDTH -gt $MAX_WIDTH ]; then
        echo "Error: Video is too wide. Maximum width is $MAX_WIDTH, but video is $WIDTH pixels wide."
        exit 1
      fi

      if [ $HEIGHT -gt $MAX_HEIGHT ]; then
        echo "Error: Video is too tall. Maximum height is $MAX_HEIGHT, but video is $HEIGHT pixels tall."
        exit 1
      fi

      echo "Video resolution check passed: $WIDTH x $HEIGHT is not larger than $MAX_WIDTH x $MAX_HEIGHT"
  rules:
    - exists:
        - $ASSIGNMENT_VIDEO_NAME.mp4
  allow_failure: true

.word_count_template: &word_count
  image: alpine:3.21.2
  before_script:
    - |
      cat > /tmp/check_word_count.sh << 'EOF'
      #!/bin/sh
      # Word count checker script
      # Usage: ./check_word_count.sh <min_words> <max_words> <file1> [<file2> ...]

      min_words=$1
      max_words=$2
      shift 2  # Remove the first two arguments (min and max)
      total_words=0

      if [ $# -eq 0 ]; then
        echo "Error: No files specified"
        exit 1
      fi

      for file in "$@"; do

        if [ ! -f "$file" ]; then
            echo "Error: File $file not found"
            exit 1
        fi

        # Count words in markdown file, excluding:
        # 1. YAML frontmatter if present
        # 2. Code blocks (content between triple backticks)
        # 3. HTML comments, including the prompts left in the template
        # 4. Content from "## Participants", "## Acknowledgements" or "## References" onwards
        # 5. Image paths and link URLs (the caption/link TEXT is still counted)
        # 6. numbers and any other characters that aren't alphabetic or whitespace
        # Note: image captions and table text ARE counted, by design.
        word_count=$(
          awk '
            NR == 1 && $0 == "---" { in_front = 1; next }
            in_front && $0 == "---" { in_front = 0; next }
            in_front { next }
            { print }
          ' "$file" |
          awk '
            BEGIN { in_code_block = 0 }
            /^```/ { in_code_block = !in_code_block; next }
            !in_code_block { print }
          ' |
          awk '
            BEGIN { inc = 0 }
            {
              out = ""; line = $0
              while (length(line) > 0) {
                if (inc) {
                  p = index(line, "-->")
                  if (p == 0) { line = "" } else { line = substr(line, p + 3); inc = 0 }
                } else {
                  p = index(line, "<!--")
                  if (p == 0) { out = out line; line = "" }
                  else { out = out substr(line, 1, p - 1); line = substr(line, p + 4); inc = 1 }
                }
              }
              print out
            }
          ' |
          awk '
            {
              h = tolower($0)
              if (h ~ /^##+ *participants/ || h ~ /^##+ *acknowledge?ments?/ || h ~ /^##+ *references/) stop = 1
              if (!stop) print
            }
          ' |
          sed -e 's/!\[\([^]]*\)\]([^)]*)/\1/g' -e 's/\[\([^]]*\)\]([^)]*)/\1/g' |
          sed 's/[^[:alpha:][:space:]]//g' |
          wc -w)

        echo "Word count for $file: $word_count"
        total_words=$((total_words + word_count))
      done

      echo "Total word count across all files: $total_words"

      if [ $total_words -lt $min_words ]; then
          echo "Error: Word count ($total_words) is less than minimum required ($min_words)"
          exit 1
      elif [ $total_words -gt $max_words ]; then
          echo "Error: Word count ($total_words) exceeds maximum allowed ($max_words)"
          exit 1
      else
          echo "Success: Word count ($total_words) is within acceptable range ($min_words - $max_words)."
          exit 0
      fi
      EOF
    - chmod +x /tmp/check_word_count.sh

check_word_count:
  stage: comp3900-checks
  needs: []  # run without waiting for the video checks
  tags:
    - comp4350
  <<: *word_count
  script:
    - /tmp/check_word_count.sh $ASSIGNMENT_MIN_WORDS $ASSIGNMENT_MAX_WORDS $ASSIGNMENT_DOCUMENT_NAME.md
  allow_failure: false

check_markdown:
  stage: comp3900-checks
  needs: []  # run without waiting for the video checks
  tags:
    - comp4350
  image: node:22-alpine
  before_script:
    - npm install -g markdownlint-cli
    - |
      cat > .markdownlint.json << 'EOF'
      {
        "default": true,
        "MD013": false,
        "MD041": false
      }
      EOF
  script:
    - echo "🔍 Linting markdown document..."
    - echo ""
    - |
      if markdownlint $ASSIGNMENT_DOCUMENT_NAME.md; then
        echo "✅ SUCCESS: Markdown document meets standards."
        echo "🎉 Great job! Your document meets the standards listed here: https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md"
      else
        echo "❌ FAILED: Markdown document does not meet standards"
        echo ""
        echo "🔧 Common fixes:"
        echo "   - Ensure headers follow proper hierarchy (# ## ### etc.)"
        echo "   - Add blank lines around headers, lists, and images"
        echo "   - Remove trailing whitespace"
        echo "   - Ensure lists are properly formatted"
        echo "   - Add blank line at end of file"
        echo ""
        echo "📚 For a detailed Markdown style guide, see:"
        echo "   https://www.markdownguide.org/basic-syntax/"
        echo "   Note that the rules for this checking script are documented here:"
        echo "   https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md"
        exit 1
      fi
      echo "✅ Document structure check passed"
  rules:
    - exists:
      - '$ASSIGNMENT_DOCUMENT_NAME.md'
  allow_failure: false

check_participants:
  stage: comp3900-checks
  needs: []  # run without waiting for the video checks
  tags:
    - comp4350
  image: alpine:3.21.2
  before_script:
    - |
      cat > /tmp/check_participants.sh << 'EOF'
      #!/bin/sh
      # Participants section checker
      # Usage: ./check_participants.sh <min_participants> <max_participants> <file>
      #
      # Validates the '## Participants' section: it must contain only a bullet
      # list of 3-5 entries in the exact format '- u1234567 Firstname Lastname',
      # with no duplicates and without the author's own uid. Enrolment of the
      # listed uids is checked separately by the course staff after cloning.

      min_participants=$1
      max_participants=$2
      file=$3
      status=0

      if [ ! -f "$file" ]; then
        echo "Error: File $file not found"
        exit 1
      fi

      # Extract the '## Participants' section (up to the next heading). Fails
      # if the heading is missing entirely.
      awk '
        /^#/ {
          h = tolower($0)
          if (h ~ /^##+ *participants/) { insec = 1; found = 1; next }
          insec = 0
        }
        insec { print }
        END { exit found ? 0 : 1 }
      ' "$file" > /tmp/participants_raw.txt || {
        echo "❌ Error: no '## Participants' section found in $file"
        echo "Add the '## Participants' heading back (see the template) and list your participants under it."
        exit 1
      }

      # Strip HTML comments (so the template's example entry and instructions
      # aren't counted), then drop blank lines.
      awk '
        {
          out = ""; line = $0
          while (length(line) > 0) {
            if (inc) {
              p = index(line, "-->")
              if (p == 0) { line = "" } else { line = substr(line, p + 3); inc = 0 }
            } else {
              p = index(line, "<!--")
              if (p == 0) { out = out line; line = "" }
              else { out = out substr(line, 1, p - 1); line = substr(line, p + 4); inc = 1 }
            }
          }
          print out
        }
      ' /tmp/participants_raw.txt | sed 's/[[:space:]]*$//' | grep -v '^[[:space:]]*$' > /tmp/participants.txt || true

      if [ ! -s /tmp/participants.txt ]; then
        echo "❌ Error: the '## Participants' section is empty."
        echo "List your participants, one per line, exactly like: - u1234567 Firstname Lastname"
        exit 1
      fi

      echo "Found participant section contents:"
      cat /tmp/participants.txt
      echo ""

      # Every (non-comment, non-blank) line must be a list entry in the
      # required format: '- ', a uid, then at least a first and last name.
      bad_lines=$(grep -vE '^- u[0-9]{7} [^[:space:]]+( [^[:space:]]+)+$' /tmp/participants.txt || true)
      if [ -n "$bad_lines" ]; then
        echo "❌ Error: these lines don't match the required format '- u1234567 Firstname Lastname':"
        printf '%s\n' "$bad_lines"
        status=1
      fi

      grep -oE '^- u[0-9]{7}' /tmp/participants.txt | cut -c3- > /tmp/participant_uids.txt || true
      count=$(wc -l < /tmp/participant_uids.txt | tr -d '[:space:]')

      if [ "$count" -lt "$min_participants" ] || [ "$count" -gt "$max_participants" ]; then
        echo "❌ Error: found $count correctly formatted participant entries; you need between $min_participants and $max_participants."
        status=1
      fi

      duplicate_uids=$(sort /tmp/participant_uids.txt | uniq -d)
      if [ -n "$duplicate_uids" ]; then
        echo "❌ Error: these uids are listed more than once:"
        printf '%s\n' "$duplicate_uids"
        status=1
      fi

      if grep -qx 'u1234567' /tmp/participant_uids.txt; then
        echo "❌ Error: u1234567 is the example uid from the template — replace it with your real participants."
        status=1
      fi

      author_uid=$(sed -n 's/^author:[[:space:]]*//p' "$file" | head -n 1 | tr -d '[:space:]')
      if [ -n "$author_uid" ] && grep -qx "$author_uid" /tmp/participant_uids.txt; then
        echo "❌ Error: your own uid ($author_uid) is in the participant list — you can't be a participant in your own study."
        status=1
      fi

      if [ "$status" -eq 0 ]; then
        echo "✅ Success: $count participants listed in the correct format."
        echo "Note: after the deadline, uids and names are verified against the class list and cross-checked against every other submission."
      fi
      exit $status
      EOF
    - chmod +x /tmp/check_participants.sh
  script:
    - /tmp/check_participants.sh $ASSIGNMENT_MIN_PARTICIPANTS $ASSIGNMENT_MAX_PARTICIPANTS $ASSIGNMENT_DOCUMENT_NAME.md
  allow_failure: false
